<mat-toolbar>
    <span><a routerLink="/home" style="cursor: default;">Impacto Manager</a></span>
    <div class="button-config">
        
        <button mat-button [matMenuTriggerFor]="alunoMenu" style="border-radius: 50px" color="primary" routerLinkActive="active" *ngIf="user.authStatus=='AUTH'" >
            Aluno
        </button>
        <mat-menu #alunoMenu="matMenu" >
            <button mat-menu-item routerLinkActive="active" *ngIf="user.authStatus=='AUTH'">
                <a routerLink="/aluno-list"> Lista </a>
            </button>
        </mat-menu>
        <button mat-button style="border-radius: 50px" color="primary" routerLinkActive="active" *ngIf="user.authStatus=='AUTH'" >
            Professor
        </button>
        <button mat-button style="border-radius: 50px" color="primary" routerLinkActive="active" *ngIf="user.authStatus=='AUTH'" >
            Turma
        </button>
        <button mat-button style="border-radius: 50px" color="primary" routerLinkActive="active" *ngIf="user.authStatus!='AUTH'">
            <a routerLink="/login">Login</a>
        </button>
        <button mat-button style="border-radius: 50px" color="primary" routerLinkActive="active" *ngIf="user.authStatus=='AUTH'"
        (click)="logout()">
            Logout
        </button>
    </div>
</mat-toolbar>
